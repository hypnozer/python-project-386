[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calendar-booking-backend"
version = "0.1.0"
description = "In-memory API for the calendar booking application"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
